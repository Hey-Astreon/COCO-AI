    <script>
      /* Pre-paint theme: pinned override (coco-theme) wins, else follow the OS. */
      (function () {
        try {
          var saved = localStorage.getItem("coco-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.toggle(
            "dark",
            window.matchMedia("(prefers-color-scheme: dark)").matches,
          );
        }
      })();
    </script>
